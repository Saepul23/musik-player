<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music Player</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#10101a;color:white;
  font-family:Arial,sans-serif;padding:25px 18px;
}
h1{color:#a78bfa;text-align:center}
.player{
  max-width:420px;margin:30px auto;
  background:#202033;padding:25px;
  border-radius:25px;text-align:center;
  box-shadow:0 10px 35px #0008;
}
.cover{
  width:210px;height:210px;margin:15px auto;
  border-radius:22px;background:linear-gradient(135deg,#7c3aed,#ec4899);
  display:grid;place-items:center;font-size:75px;
}
h2{font-size:22px;margin-bottom:5px}
p{color:#aaa}
button{
  border:0;border-radius:30px;padding:13px 17px;
  background:#8b5cf6;color:white;font-size:16px;
  margin:5px;cursor:pointer;
}
button:active{transform:scale(.95)}
.controls{margin:20px 0}
input[type=range]{width:100%;accent-color:#a78bfa}
#songs{text-align:left;margin-top:20px}
.song{
  padding:13px;background:#303047;
  border-radius:12px;margin:8px 0;cursor:pointer;
}
.song.active{background:#6241a3}
input[type=file]{
  width:100%;margin-top:15px;color:#ddd;
}
</style>
  
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#10101a">
  
</head>
<body>

<h1>♫ MY MUSIC</h1>

<div class="player">
  <div class="cover">🎧</div>
  <h2 id="title">Belum ada lagu</h2>
  <p id="status">Pilih musik dari HP lu</p>

  <audio id="audio"></audio>

  <input type="range" id="progress"
  value="0" min="0" max="100">

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="playPause()" id="play">▶</button>
    <button onclick="next()">⏭</button>
  </div>

  <p>Volume</p>
  <input type="range" id="volume"
  min="0" max="1" step="0.01" value="0.8">

  <input type="file" id="files"
  accept="audio/*" multiple>

  <div id="songs"></div>
</div>

<script>
const audio=document.getElementById("audio");
const files=document.getElementById("files");
const songs=document.getElementById("songs");
const title=document.getElementById("title");
const play=document.getElementById("play");
const progress=document.getElementById("progress");
let playlist=[];
let index=0;

files.onchange=()=>{
  playlist.forEach(s=>URL.revokeObjectURL(s.url));
  playlist=Array.from(files.files).map(file=>({
    name:file.name,
    url:URL.createObjectURL(file)
  }));
  index=0;
  render();
  if(playlist.length) loadSong();
};

function render(){
  songs.innerHTML="";
  playlist.forEach((s,i)=>{
    const div=document.createElement("div");
    div.className="song"+(i===index?" active":"");
    div.textContent="♫ "+s.name;
    div.onclick=()=>{index=i;loadSong();};
    songs.appendChild(div);
  });
}

function loadSong(){
  if(!playlist.length)return;
  audio.src=playlist[index].url;
  title.textContent=playlist[index].name;
  render();
  audio.play().then(()=>{
    play.textContent="⏸";
  }).catch(()=>{play.textContent="▶";});
}

function playPause(){
  if(!playlist.length){
    files.click();return;
  }
  if(audio.paused){
    audio.play();
    play.textContent="⏸";
  }else{
    audio.pause();
    play.textContent="▶";
  }
}

function next(){
  if(!playlist.length)return;
  index=(index+1)%playlist.length;
  loadSong();
}

function prev(){
  if(!playlist.length)return;
  index=(index-1+playlist.length)%playlist.length;
  loadSong();
}

audio.ontimeupdate=()=>{
  if(audio.duration){
    progress.value=audio.currentTime/audio.duration*100;
  }
};

progress.oninput=()=>{
  if(audio.duration){
    audio.currentTime=progress.value/100*audio.duration;
  }
};

document.getElementById("volume").oninput=e=>{
  audio.volume=e.target.value;
};

audio.onended=next;
audio.onplay=()=>play.textContent="⏸";
audio.onpause=()=>play.textContent="▶";
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
  
</body>
</html>
